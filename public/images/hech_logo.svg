<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="hechGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#e11d48" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Stylized Monogram Shield / Flame -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="130" height="130" rx="28" fill="url(#hechGrad)" filter="url(#glow)"/>
    <path d="M35 30 L95 30 L95 50 L35 50 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M35 55 L95 55 L95 75 L35 75 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M35 80 L70 80 L70 100 L35 100 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Dynamic Swoosh / Crown Accent -->
    <path d="M80 80 L105 80 L92 100 Z" fill="url(#goldAccent)"/>
  </g>

  <!-- Typography -->
  <text x="165" y="75" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="4">
    HECh
  </text>
  
  <text x="168" y="105" font-family="'Lexend', sans-serif" font-weight="700" font-size="16" fill="#fb7185" letter-spacing="3">
    HAUTE ÉCOLE CHARLEMAGNE
  </text>

  <text x="168" y="126" font-family="'Lexend', sans-serif" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="1.5">
    Service d'Accompagnement à la Réussite (SAR)
  </text>
</svg>
