name: Déploiement Automatique GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Autorise les permissions nécessaires pour le déploiement GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Évite les déploiements concurrents
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Installer les dépendances
        run: npm ci

      - name: 🚀 Compiler le projet Vite (mode production)
        run: npm run build

      - name: 🌐 Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Téléverser l'artefact de déploiement (dossier dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: 🚢 Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
